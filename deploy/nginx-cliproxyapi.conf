# ==============================================================================
# Nginx 反向代理配置模板 - CLIProxyAPI 高可用生产环境
# 
# 关键优化说明：
# 1. proxy_read_timeout 600s: 彻底杜绝 Gemini 4 Argon / Claude 深度思考长耗时导致 
#    Nginx 默认 60s 断开连接触发 HTTP 499 及客户端 "Error: Connection error"。
# 2. proxy_buffering off & chunked_transfer_encoding on:
#    关闭代理缓冲区，确保 Server-Sent Events (SSE) 流式分块即时下发至客户端。
# 3. proxy_http_version 1.1 & Connection "": 维持长连接复用，降低 TCP 握手开销。
# ==============================================================================

# HTTP 重定向至 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # 替换为您的实际解析域名

    # Let's Encrypt ACME 证书校验目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 业务反向代理
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com; # 替换为您的实际解析域名

    # SSL 证书配置（以 Certbot 生成的证书路径为例）
    ssl_certificate     /etc/letsencrypt/live/api.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.yourdomain.com/privkey.pem;

    # SSL 协议与套件优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 允许上传的多模态媒体文件大小（如长视频、超大 PDF 分析）
    client_max_body_size 100m;

    location / {
        # 后端 CLIProxyAPI 监听地址
        proxy_pass http://127.0.0.1:8317;

        # HTTP/1.1 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 传递真实客户端来源信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 禁用缓冲与缓存，保障 SSE 逐 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 超时时间调整（匹配 LLM 长思考生命周期）
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }
}
